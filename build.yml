name: Build ZartKlm APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Générer le wrapper Gradle 8.2.1
        run: gradle wrapper --gradle-version 8.2.1 --distribution-type bin

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ZartKlm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
